# Build number comes from the run number; the app offers newer builds itself.
name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**','.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Keep signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android
          key: android-debug-key-v2
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        env: { VCODE: '${{ github.run_number }}' }
        run: |
          cp index.html android/app/src/main/assets/index.html
          cd android && gradle assembleDebug --no-daemon
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ChamberlaCollector.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChamberlaCollector.apk --title "Chamberla Collector" --notes "Latest Android app, build ${{ github.run_number }}. Install once; the app finds new builds and offers to install them."
